layers:
- name: Conv1
  core_allocation: [[0, 1, 2, 3]]
  inter_core_tiling:
  - - dim: D1
      split: 4
- name: Conv2
  core_allocation: [[0, 1, 2, 3]]
  inter_core_tiling:
  - - dim: D1
      split: 4
fused_groups:
- name: conv_chain
  layers: [Conv1, Conv2]
  intra_core_tiling:
  - dim: Conv2.D0
    tile: 1
