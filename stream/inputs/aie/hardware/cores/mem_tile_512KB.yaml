name: mem_tile
type: aie2.memory
max_object_fifo_depth: 48

memory:
  capacity: 4194304  # 512 KB in bits, AIE2TargetModel::getMemTileSize
  bandwidth_min: 128  # bits/cc
  bandwidth_max: 768  # bits/cc

dma:  # tile DMA channels, each moving 64 bits a cycle as traced on NPU2, the width of the links
  mm2s: 6
  s2mm: 6
  channel_bits: 64
