name: shim_dma
type: aie2.shim
max_object_fifo_depth: 48

memory:
  capacity: 10000000000  # effectively unlimited (off-chip backing)
  bandwidth_min: 128  # bits/cc
  bandwidth_max: 128  # bits/cc

dma:  # tile DMA channels, each moving 64 bits a cycle as traced on NPU2, the width of the links
  mm2s: 2
  s2mm: 2
  channel_bits: 64
  buffer_descriptors: 16
  iterations: 64
