name: aie_tile
type: aie2.compute
max_object_fifo_depth: 12

memory:
  capacity: 524288  # 64 KB in bits (top-level L1 tile memory)
  bandwidth_min: 512  # bits/cc
  bandwidth_max: 512  # bits/cc

dma:  # tile DMA channels, each moving 64 bits a cycle as traced on NPU2, the width of the links
  mm2s: 2
  s2mm: 2
  channel_bits: 64
