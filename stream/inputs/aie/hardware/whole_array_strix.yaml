connections:
  # ───── Connect DRAM, through the column's shim, to its mem tile (Column 0) ─────
  - type: link
    memories: [dram, tile_0_1]
    bandwidth: 64
  # ───── Connect mem_tile to aie_tile (Column 0) ─────
  - type: link
    memories: [tile_0_1, tile_0_2]
    bandwidth: 64
  # ───── Connect aie_tile to aie_tile (Column 0) ─────
  - type: link
    memories: [tile_0_2, tile_0_3]
    bandwidth: 64
  - type: link
    memories: [tile_0_3, tile_0_4]
    bandwidth: 64
  - type: link
    memories: [tile_0_4, tile_0_5]
    bandwidth: 64

