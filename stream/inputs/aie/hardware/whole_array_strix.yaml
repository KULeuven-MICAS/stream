bandwidth:
  dram:
    ceiling: 296.6
    contiguous: 148.3
    strided:
      read: {32: 19.0, 64: 35.2, 128: 53.5, 256: 57.2, 512: 93.5}
      write: {32: 17.1, 64: 28.3, 128: 53.2, 256: 54.2, 512: 93.5}
reconfiguration:  # a dispatch of SwiGLU's five designs from IRON costs 1.0-1.3 ms over its groups
  cycles_per_column: 40000
  reset_cycles: 63000
# DRAM is the off-chip memory; every tile's memory is its own.
memories:
  dram:
    offchip: true
    views: []
    capacity_bits: 10000000000
    ports:  # one shim tile's DMA: two 64-bit channels each way
      mm2s: {bandwidth: 128, serves: {any: [read]}, read_energy: 0, write_energy: 0}
      s2mm: {bandwidth: 128, serves: {any: [write]}, read_energy: 0, write_energy: 0}
  tile_0_1:
    offchip: false
    views: [1.memory]
    ports:
      mm2s: {from: mm2s, cores: [1]}
      s2mm: {from: s2mm, cores: [1]}
  tile_0_2:
    offchip: false
    views: [2.memory]
