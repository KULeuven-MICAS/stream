offchip_core_id: 0
bandwidth:
  dram:
    ceiling: 296.6
    contiguous: 148.3
    strided:
      read: {32: 19.0, 64: 35.2, 128: 53.5, 256: 57.2, 512: 93.5}
      write: {32: 17.1, 64: 28.3, 128: 53.2, 256: 54.2, 512: 93.5}
reconfiguration:  # a dispatch of SwiGLU's five designs from IRON costs 1.0-1.3 ms over its groups
  cycles_per_column: 40000
  reset_cycles: 63000
# Every column's shim reaches the one DRAM; any other tile's memory is its own.
memories:
  dram: [0.memory, 6.memory, 12.memory, 18.memory, 24.memory, 30.memory, 36.memory, 42.memory]
  tile_0_1: [1.memory]
