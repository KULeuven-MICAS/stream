name: single_core
kernel_library: ../kernels/aie2p.toml
cores:
  1: mem_tile_256KB.yaml
  2: aie_tile.yaml
core_coordinates:
  1: [0, 1]
  2: [0, 2]
memories:
  dram:
    offchip: true
    views: []
    capacity_bits: 10000000000
    dma:
      buffer_descriptors: 16
      iterations: 64
    ports:
      mm2s: {bandwidth: 128, channels: 2, serves: {any: [read]}, read_energy: 0, write_energy: 0}
      s2mm: {bandwidth: 128, channels: 2, serves: {any: [write]}, read_energy: 0, write_energy: 0}
  tile_0_1:
    offchip: false
    views: [1.memory]
    ports:
      mm2s: {from: mm2s, cores: [1]}
      s2mm: {from: s2mm, cores: [1]}
  tile_0_2:
    offchip: false
    views: [2.memory]
    ports:
      mm2s: {from: mm2s, cores: [2]}
      s2mm: {from: s2mm, cores: [2]}

connections:
  # ───── Connect DRAM to mem_tile ─────
  - type: link
    ends:
      dram: [mm2s, s2mm]
      tile_0_1: [mm2s, s2mm]
    bandwidth: 64
  # ───── Connect mem_tile to aie_tile ─────
  - type: link
    ends:
      tile_0_1: [mm2s, s2mm]
      tile_0_2: [mm2s, s2mm]
    bandwidth: 64
unit_energy_cost: 0
