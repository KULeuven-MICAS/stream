name: whole_array
kernel_library: ../kernels/aie2p.toml
cores:
  0: ./cores/shim_dma.yaml
  1: ./cores/mem_tile_256KB.yaml
  2: ./cores/aie_tile.yaml
  3: ./cores/aie_tile.yaml
  4: ./cores/aie_tile.yaml
  5: ./cores/aie_tile.yaml
  6: ./cores/mem_tile_256KB.yaml
  7: ./cores/aie_tile.yaml
  8: ./cores/aie_tile.yaml
  9: ./cores/aie_tile.yaml
  10: ./cores/aie_tile.yaml
  11: ./cores/mem_tile_256KB.yaml
  12: ./cores/aie_tile.yaml
  13: ./cores/aie_tile.yaml
  14: ./cores/aie_tile.yaml
  15: ./cores/aie_tile.yaml
  16: ./cores/mem_tile_256KB.yaml
  17: ./cores/aie_tile.yaml
  18: ./cores/aie_tile.yaml
  19: ./cores/aie_tile.yaml
  20: ./cores/aie_tile.yaml
core_coordinates:
# code id: [col, row]
  0: [0, 0]
  1: [0, 1]
  2: [0, 2]
  3: [0, 3]
  4: [0, 4]
  5: [0, 5]
  6: [1, 1]
  7: [1, 2]
  8: [1, 3]
  9: [1, 4]
  10: [1, 5]
  11: [2, 1]
  12: [2, 2]
  13: [2, 3]
  14: [2, 4]
  15: [2, 5]
  16: [3, 1]
  17: [3, 2]
  18: [3, 3]
  19: [3, 4]
  20: [3, 5]
offchip_core_id: 0
memories:
  tile_0_0: [0.memory]
  tile_0_1: [1.memory]
  tile_0_2: [2.memory]
  tile_0_3: [3.memory]
  tile_0_4: [4.memory]
  tile_0_5: [5.memory]
  tile_1_1: [6.memory]
  tile_1_2: [7.memory]
  tile_1_3: [8.memory]
  tile_1_4: [9.memory]
  tile_1_5: [10.memory]
  tile_2_1: [11.memory]
  tile_2_2: [12.memory]
  tile_2_3: [13.memory]
  tile_2_4: [14.memory]
  tile_2_5: [15.memory]
  tile_3_1: [16.memory]
  tile_3_2: [17.memory]
  tile_3_3: [18.memory]
  tile_3_4: [19.memory]
  tile_3_5: [20.memory]

connections:
  # ───── Connect shim_dma to mem_tile (Column 0) ─────
  - type: link
    memories: [tile_0_0, tile_0_1]
    bandwidth: 64
  # ───── Connect mem_tile to aie_tile (Column 0) ─────
  - type: link
    memories: [tile_0_1, tile_0_2]
    bandwidth: 64
  # ───── Connect aie_tile to aie_tile (Column 0) ─────
  - type: link
    memories: [tile_0_2, tile_0_3]
    bandwidth: 64
  - type: link
    memories: [tile_0_3, tile_0_4]
    bandwidth: 64
  - type: link
    memories: [tile_0_4, tile_0_5]
    bandwidth: 64

  # ───── Connect shim_dma to mem_tile (Column 1) ─────
  - type: link
    memories: [tile_0_0, tile_1_1]
    bandwidth: 64
  # ───── Connect mem_tile to aie_tile (Column 1) ─────
  - type: link
    memories: [tile_1_1, tile_1_2]
    bandwidth: 64
  # ───── Connect aie_tile to aie_tile (Column 1) ─────
  - type: link
    memories: [tile_1_2, tile_1_3]
    bandwidth: 64
  - type: link
    memories: [tile_1_3, tile_1_4]
    bandwidth: 64
  - type: link
    memories: [tile_1_4, tile_1_5]
    bandwidth: 64

  # ───── Connect shim_dma to mem_tile (Column 2) ─────
  - type: link
    memories: [tile_0_0, tile_2_1]
    bandwidth: 64
  # ───── Connect mem_tile to aie_tile (Column 2) ─────
  - type: link
    memories: [tile_2_1, tile_2_2]
    bandwidth: 64
  # ───── Connect aie_tile to aie_tile (Column 2) ─────
  - type: link
    memories: [tile_2_2, tile_2_3]
    bandwidth: 64
  - type: link
    memories: [tile_2_3, tile_2_4]
    bandwidth: 64
  - type: link
    memories: [tile_2_4, tile_2_5]
    bandwidth: 64

  # ───── Connect shim_dma to mem_tile (Column 3) ─────
  - type: link
    memories: [tile_0_0, tile_3_1]
    bandwidth: 64
  # ───── Connect mem_tile to aie_tile (Column 3) ─────
  - type: link
    memories: [tile_3_1, tile_3_2]
    bandwidth: 64
  # ───── Connect aie_tile to aie_tile (Column 3) ─────
  - type: link
    memories: [tile_3_2, tile_3_3]
    bandwidth: 64
  - type: link
    memories: [tile_3_3, tile_3_4]
    bandwidth: 64
  - type: link
    memories: [tile_3_4, tile_3_5]
    bandwidth: 64

  # ───── Connect adjacent aie_tiles across columns (West-East) ─────
  # Row 2
  - type: link
    memories: [tile_0_2, tile_1_2]
    bandwidth: 64
  - type: link
    memories: [tile_1_2, tile_2_2]
    bandwidth: 64
  - type: link
    memories: [tile_2_2, tile_3_2]
    bandwidth: 64
  # Row 3
  - type: link
    memories: [tile_0_3, tile_1_3]
    bandwidth: 64
  - type: link
    memories: [tile_1_3, tile_2_3]
    bandwidth: 64
  - type: link
    memories: [tile_2_3, tile_3_3]
    bandwidth: 64
  # Row 4
  - type: link
    memories: [tile_0_4, tile_1_4]
    bandwidth: 64
  - type: link
    memories: [tile_1_4, tile_2_4]
    bandwidth: 64
  - type: link
    memories: [tile_2_4, tile_3_4]
    bandwidth: 64
  # Row 5
  - type: link
    memories: [tile_0_5, tile_1_5]
    bandwidth: 64
  - type: link
    memories: [tile_1_5, tile_2_5]
    bandwidth: 64
  - type: link
    memories: [tile_2_5, tile_3_5]
    bandwidth: 64
