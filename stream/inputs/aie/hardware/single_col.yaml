name: single_col
kernel_library: ../kernels/aie2p.toml
cores:
  1: mem_tile_256KB.yaml
  2: aie_tile.yaml
  3: aie_tile.yaml
  4: aie_tile.yaml
  5: aie_tile.yaml
core_coordinates:
  1: [0, 1]
  2: [0, 2]
  3: [0, 3]
  4: [0, 4]
  5: [0, 5]
memories:
  dram:
    offchip: true
    views: []
    capacity_bits: 10000000000
    ports:  # one shim tile's DMA: two 64-bit channels each way
      mm2s: {bandwidth: 128, serves: {any: [read]}, read_energy: 0, write_energy: 0}
      s2mm: {bandwidth: 128, serves: {any: [write]}, read_energy: 0, write_energy: 0}
  tile_0_1:
    offchip: false
    views: [1.memory]
    ports:
      mm2s: {from: mm2s, cores: [1]}
      s2mm: {from: s2mm, cores: [1]}
  tile_0_2:
    offchip: false
    views: [2.memory]
    ports:
      mm2s: {from: mm2s, cores: [2]}
      s2mm: {from: s2mm, cores: [2]}
  tile_0_3:
    offchip: false
    views: [3.memory]
    ports:
      mm2s: {from: mm2s, cores: [3]}
      s2mm: {from: s2mm, cores: [3]}
  tile_0_4:
    offchip: false
    views: [4.memory]
    ports:
      mm2s: {from: mm2s, cores: [4]}
      s2mm: {from: s2mm, cores: [4]}
  tile_0_5:
    offchip: false
    views: [5.memory]
    ports:
      mm2s: {from: mm2s, cores: [5]}
      s2mm: {from: s2mm, cores: [5]}

connections:
  # ───── Connect DRAM to mem_tile ─────
  - type: link
    ends:
      dram: [mm2s, s2mm]
      tile_0_1: [mm2s, s2mm]
    bandwidth: 64
  # ───── Connect mem_tile to aie_tile ─────
  - type: link
    ends:
      tile_0_1: [mm2s, s2mm]
      tile_0_2: [mm2s, s2mm]
    bandwidth: 64
  # ───── Connect aie_tile to aie_tile ─────
  - type: link
    ends:
      tile_0_2: [mm2s, s2mm]
      tile_0_3: [mm2s, s2mm]
    bandwidth: 64
  - type: link
    ends:
      tile_0_3: [mm2s, s2mm]
      tile_0_4: [mm2s, s2mm]
    bandwidth: 64
  - type: link
    ends:
      tile_0_4: [mm2s, s2mm]
      tile_0_5: [mm2s, s2mm]
    bandwidth: 64
unit_energy_cost: 0
