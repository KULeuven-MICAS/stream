name: single_col
kernel_library: ../kernels/aie2p.toml
cores:
  0: shim_dma.yaml
  1: mem_tile_256KB.yaml
  2: aie_tile.yaml
  3: aie_tile.yaml
  4: aie_tile.yaml
  5: aie_tile.yaml
core_coordinates:
  0: [0, 0]
  1: [0, 1]
  2: [0, 2]
  3: [0, 3]
  4: [0, 4]
  5: [0, 5]
offchip_core_id: 0
memories:
  tile_0_0: [0.memory]
  tile_0_1: [1.memory]
  tile_0_2: [2.memory]
  tile_0_3: [3.memory]
  tile_0_4: [4.memory]
  tile_0_5: [5.memory]

connections:
  # ───── Connect shim_dma to mem_tile ─────
  - type: link
    memories: [tile_0_0, tile_0_1]
    bandwidth: 64
  # ───── Connect mem_tile to aie_tile ─────
  - type: link
    memories: [tile_0_1, tile_0_2]
    bandwidth: 64
  # ───── Connect aie_tile to aie_tile ─────
  - type: link
    memories: [tile_0_2, tile_0_3]
    bandwidth: 64
  - type: link
    memories: [tile_0_3, tile_0_4]
    bandwidth: 64
  - type: link
    memories: [tile_0_4, tile_0_5]
    bandwidth: 64
unit_energy_cost: 0
