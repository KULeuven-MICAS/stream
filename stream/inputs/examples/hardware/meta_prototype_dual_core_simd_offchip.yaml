# Two meta-prototype compute cores plus pooling, SIMD and an off-chip DRAM controller
name: meta-proto-2-core-with-pooling-and-offchip-cores

cores:
  0: meta_prototype.yaml   # compute-core A
  1: meta_prototype.yaml   # compute-core B
  2: pooling.yaml          # pooling engine
  3: simd.yaml             # SIMD unit
  4: offchip.yaml          # DRAM controller

offchip_core_id: 4         # which core fronts external memory
unit_energy_cost: 0        # default energy per transferred word

# Each meta_prototype core's view is its activation SRAM, the top level of its activations and outputs; its weight
# SRAM, the top level of its weights, stays private to it.
memories:
  meta_prototype_0: [0.sram_1MB_A]
  meta_prototype_1: [1.sram_1MB_A]
  pooling: [2.sram_128KB]
  simd: [3.sram_128KB_2rw]
  offchip: [4.dram]

connections:
  # ─── direct link between the two compute cores ───
  - type: link
    memories: [meta_prototype_0, meta_prototype_1]
    bandwidth: 64

  # ─── pooling core connected to each compute core ───
  - type: link
    memories: [meta_prototype_0, pooling]
    bandwidth: 64
  - type: link
    memories: [meta_prototype_1, pooling]
    bandwidth: 64

  # ─── SIMD core connected to each compute core ───
  - type: link
    memories: [meta_prototype_0, simd]
    bandwidth: 64
  - type: link
    memories: [meta_prototype_1, simd]
    bandwidth: 64

  # ─── shared bus to off-chip memory (all on-chip cores + controller) ───
  - type: bus
    memories: [meta_prototype_0, meta_prototype_1, pooling, simd, offchip]
    bandwidth: 128        # wider than on-chip point-to-point links
