# Four Eyeriss-like compute cores with pooling, SIMD and an off-chip DRAM controller
name: eyeriss_like_quad_core

cores:
  0: eyeriss_like.yaml   # compute A
  1: eyeriss_like.yaml   # compute B
  2: eyeriss_like.yaml   # compute C
  3: eyeriss_like.yaml   # compute D
  4: pooling.yaml        # pooling helper
  5: simd.yaml           # SIMD helper

unit_energy_cost: 0      # default energy per transferred word

memories:
  eyeriss_like_0:
    offchip: false
    views: [0.sram_1M]
    ports:
      rw_port_1: {from: rw_port_1, cores: [0]}
      rw_port_2: {from: rw_port_2, cores: [0]}
  eyeriss_like_1:
    offchip: false
    views: [1.sram_1M]
    ports:
      rw_port_1: {from: rw_port_1, cores: [1]}
      rw_port_2: {from: rw_port_2, cores: [1]}
  eyeriss_like_2:
    offchip: false
    views: [2.sram_1M]
    ports:
      rw_port_1: {from: rw_port_1, cores: [2]}
      rw_port_2: {from: rw_port_2, cores: [2]}
  eyeriss_like_3:
    offchip: false
    views: [3.sram_1M]
    ports:
      rw_port_1: {from: rw_port_1, cores: [3]}
      rw_port_2: {from: rw_port_2, cores: [3]}
  pooling:
    offchip: false
    views: [4.sram_128KB]
    ports:
      r_port_1: {from: r_port_1, cores: [4]}
      w_port_1: {from: w_port_1, cores: [4]}
  simd:
    offchip: false
    views: [5.sram_128KB_2rw]
    ports:
      rw_port_1: {from: rw_port_1, cores: [5]}
      rw_port_2: {from: rw_port_2, cores: [5]}
  offchip:
    offchip: true
    views: []
    capacity_bits: 10000000000
    ports:
      rw_port_1: {bandwidth: 64, serves: {any: [read, write]}, read_energy: 15.625, write_energy: 15.625}

connections:
  # ───── 2-D mesh links among compute cores ─────
  - type: link
    ends:
      eyeriss_like_0: [rw_port_1, rw_port_2]
      eyeriss_like_1: [rw_port_1, rw_port_2]
    bandwidth: 32
  - type: link
    ends:
      eyeriss_like_1: [rw_port_1, rw_port_2]
      eyeriss_like_2: [rw_port_1, rw_port_2]
    bandwidth: 32
  - type: link
    ends:
      eyeriss_like_2: [rw_port_1, rw_port_2]
      eyeriss_like_3: [rw_port_1, rw_port_2]
    bandwidth: 32
  - type: link            # extra link as in original spec
    ends:
      eyeriss_like_3: [rw_port_1, rw_port_2]
      eyeriss_like_1: [rw_port_1, rw_port_2]
    bandwidth: 32

  # ───── Pooling core connected to every compute core ─────
  - {type: link, ends: {eyeriss_like_0: [rw_port_1, rw_port_2], pooling: [r_port_1, w_port_1]}, bandwidth: 32}
  - {type: link, ends: {eyeriss_like_1: [rw_port_1, rw_port_2], pooling: [r_port_1, w_port_1]}, bandwidth: 32}
  - {type: link, ends: {eyeriss_like_2: [rw_port_1, rw_port_2], pooling: [r_port_1, w_port_1]}, bandwidth: 32}
  - {type: link, ends: {eyeriss_like_3: [rw_port_1, rw_port_2], pooling: [r_port_1, w_port_1]}, bandwidth: 32}

  # ───── SIMD core connected to every compute core ─────
  - {type: link, ends: {eyeriss_like_0: [rw_port_1, rw_port_2], simd: [rw_port_1, rw_port_2]}, bandwidth: 32}
  - {type: link, ends: {eyeriss_like_1: [rw_port_1, rw_port_2], simd: [rw_port_1, rw_port_2]}, bandwidth: 32}
  - {type: link, ends: {eyeriss_like_2: [rw_port_1, rw_port_2], simd: [rw_port_1, rw_port_2]}, bandwidth: 32}
  - {type: link, ends: {eyeriss_like_3: [rw_port_1, rw_port_2], simd: [rw_port_1, rw_port_2]}, bandwidth: 32}

  # ───── Shared bus to off-chip DRAM ─────
  - type: bus
    ends:   # all on-chip cores + controller
      eyeriss_like_0: [rw_port_1, rw_port_2]
      eyeriss_like_1: [rw_port_1, rw_port_2]
      eyeriss_like_2: [rw_port_1, rw_port_2]
      eyeriss_like_3: [rw_port_1, rw_port_2]
      pooling: [r_port_1, w_port_1]
      simd: [rw_port_1, rw_port_2]
      offchip: [rw_port_1]
    bandwidth: 128                 # wider than on-chip point-to-point links
