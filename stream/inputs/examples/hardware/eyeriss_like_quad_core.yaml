# Four Eyeriss-like compute cores with pooling, SIMD and an off-chip DRAM controller
name: eyeriss_like_quad_core

cores:
  0: eyeriss_like.yaml   # compute A
  1: eyeriss_like.yaml   # compute B
  2: eyeriss_like.yaml   # compute C
  3: eyeriss_like.yaml   # compute D
  4: pooling.yaml        # pooling helper
  5: simd.yaml           # SIMD helper
  6: offchip.yaml        # DRAM controller

offchip_core_id: 6       # core that fronts external memory
unit_energy_cost: 0      # default energy per transferred word

memories:
  eyeriss_like_0: [0.sram_1M]
  eyeriss_like_1: [1.sram_1M]
  eyeriss_like_2: [2.sram_1M]
  eyeriss_like_3: [3.sram_1M]
  pooling: [4.sram_128KB]
  simd: [5.sram_128KB_2rw]
  offchip: [6.dram]

connections:
  # ───── 2-D mesh links among compute cores ─────
  - type: link
    memories: [eyeriss_like_0, eyeriss_like_1]
    bandwidth: 32
  - type: link
    memories: [eyeriss_like_1, eyeriss_like_2]
    bandwidth: 32
  - type: link
    memories: [eyeriss_like_2, eyeriss_like_3]
    bandwidth: 32
  - type: link            # extra link as in original spec
    memories: [eyeriss_like_3, eyeriss_like_1]
    bandwidth: 32

  # ───── Pooling core connected to every compute core ─────
  - {type: link, memories: [eyeriss_like_0, pooling], bandwidth: 32}
  - {type: link, memories: [eyeriss_like_1, pooling], bandwidth: 32}
  - {type: link, memories: [eyeriss_like_2, pooling], bandwidth: 32}
  - {type: link, memories: [eyeriss_like_3, pooling], bandwidth: 32}

  # ───── SIMD core connected to every compute core ─────
  - {type: link, memories: [eyeriss_like_0, simd], bandwidth: 32}
  - {type: link, memories: [eyeriss_like_1, simd], bandwidth: 32}
  - {type: link, memories: [eyeriss_like_2, simd], bandwidth: 32}
  - {type: link, memories: [eyeriss_like_3, simd], bandwidth: 32}

  # ───── Shared bus to off-chip DRAM ─────
  - type: bus
    memories: [eyeriss_like_0, eyeriss_like_1, eyeriss_like_2, eyeriss_like_3, pooling, simd, offchip]   # all on-chip cores + controller
    bandwidth: 128                 # wider than on-chip point-to-point links
