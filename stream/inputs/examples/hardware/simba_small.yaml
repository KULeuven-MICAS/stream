# 2 × 2 SIMBA mesh with an explicit off-chip DRAM controller
name: simba_package_small

cores:
  0: simba_chiplet.yaml   # chiplet A
  1: simba_chiplet.yaml   # chiplet B
  2: simba_chiplet.yaml   # chiplet C
  3: simba_chiplet.yaml   # chiplet D
  4: simba_offchip.yaml   # package-level DRAM controller

offchip_core_id: 4        # core that fronts external memory
unit_energy_cost: 0       # default energy per transferred word

memories:
  simba_chiplet_0: [0.global_buffer]
  simba_chiplet_1: [1.global_buffer]
  simba_chiplet_2: [2.global_buffer]
  simba_chiplet_3: [3.global_buffer]
  simba_offchip: [4.dram]

connections:
  # ───── 2-D mesh links between chiplets ─────
  - type: link
    memories: [simba_chiplet_0, simba_chiplet_1]
    bandwidth: 32
  - type: link
    memories: [simba_chiplet_0, simba_chiplet_2]
    bandwidth: 32
  - type: link
    memories: [simba_chiplet_1, simba_chiplet_3]
    bandwidth: 32
  - type: link
    memories: [simba_chiplet_2, simba_chiplet_3]
    bandwidth: 32

  # ───── Shared bus to off-chip memory ─────
  - type: bus
    memories: [simba_chiplet_0, simba_chiplet_1, simba_chiplet_2, simba_chiplet_3, simba_offchip]   # all chiplets + DRAM controller
    bandwidth: 128           # wider than on-chip links
