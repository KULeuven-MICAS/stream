# 2 × 2 SIMBA mesh with an explicit off-chip DRAM controller
name: simba_package_small

cores:
  0: simba_chiplet.yaml   # chiplet A
  1: simba_chiplet.yaml   # chiplet B
  2: simba_chiplet.yaml   # chiplet C
  3: simba_chiplet.yaml   # chiplet D

unit_energy_cost: 0       # default energy per transferred word

memories:
  simba_chiplet_0:
    offchip: false
    views: [0.global_buffer]
    ports:
      r_port_1: {from: r_port_1, cores: [0]}
      w_port_1: {from: w_port_1, cores: [0]}
  simba_chiplet_1:
    offchip: false
    views: [1.global_buffer]
    ports:
      r_port_1: {from: r_port_1, cores: [1]}
      w_port_1: {from: w_port_1, cores: [1]}
  simba_chiplet_2:
    offchip: false
    views: [2.global_buffer]
    ports:
      r_port_1: {from: r_port_1, cores: [2]}
      w_port_1: {from: w_port_1, cores: [2]}
  simba_chiplet_3:
    offchip: false
    views: [3.global_buffer]
    ports:
      r_port_1: {from: r_port_1, cores: [3]}
      w_port_1: {from: w_port_1, cores: [3]}
  simba_offchip:
    offchip: true
    views: []
    capacity_bits: 10000000000
    ports:
      rw_port_1: {bandwidth: 64, serves: {any: [read, write]}, read_energy: 1.5625, write_energy: 1.5625}

connections:
  # ───── 2-D mesh links between chiplets ─────
  - type: link
    ends:
      simba_chiplet_0: [r_port_1, w_port_1]
      simba_chiplet_1: [r_port_1, w_port_1]
    bandwidth: 32
  - type: link
    ends:
      simba_chiplet_0: [r_port_1, w_port_1]
      simba_chiplet_2: [r_port_1, w_port_1]
    bandwidth: 32
  - type: link
    ends:
      simba_chiplet_1: [r_port_1, w_port_1]
      simba_chiplet_3: [r_port_1, w_port_1]
    bandwidth: 32
  - type: link
    ends:
      simba_chiplet_2: [r_port_1, w_port_1]
      simba_chiplet_3: [r_port_1, w_port_1]
    bandwidth: 32

  # ───── Shared bus to off-chip memory ─────
  - type: bus
    ends:   # all chiplets + DRAM controller
      simba_chiplet_0: [r_port_1, w_port_1]
      simba_chiplet_1: [r_port_1, w_port_1]
      simba_chiplet_2: [r_port_1, w_port_1]
      simba_chiplet_3: [r_port_1, w_port_1]
      simba_offchip: [rw_port_1]
    bandwidth: 128           # wider than on-chip links
