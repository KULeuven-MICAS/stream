  # ───────── Per-column off-chip DRAM links (Strix-style distributed memory access) ─────────
  # Each column's edge chiplet (row 0 = cores 0..5) gets its OWN link to the DRAM controller
  # (core 36), so DRAM bandwidth is distributed across 6 links rather than one shared bus. A single
  # shared bus is used in every steady-state slot and so has zero boundary idle, pinning the TETRA
  # inter-iteration overlap to 0; per-column links let that overlap grow when layers sit on different
  # columns. Deeper chiplets reach DRAM by routing up their column through the (wide) mesh.
  - {type: link, ends: {simba_offchip: [rw_port_1], simba_chiplet_0: [r_port_1, w_port_1]}, bandwidth: 256}
  - {type: link, ends: {simba_offchip: [rw_port_1], simba_chiplet_1: [r_port_1, w_port_1]}, bandwidth: 256}
  - {type: link, ends: {simba_offchip: [rw_port_1], simba_chiplet_2: [r_port_1, w_port_1]}, bandwidth: 256}
  - {type: link, ends: {simba_offchip: [rw_port_1], simba_chiplet_3: [r_port_1, w_port_1]}, bandwidth: 256}
  - {type: link, ends: {simba_offchip: [rw_port_1], simba_chiplet_4: [r_port_1, w_port_1]}, bandwidth: 256}
  - {type: link, ends: {simba_offchip: [rw_port_1], simba_chiplet_5: [r_port_1, w_port_1]}, bandwidth: 256}
