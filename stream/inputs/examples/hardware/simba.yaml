  - {type: link, memories: [simba_chiplet_31, simba_chiplet_32], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_32, simba_chiplet_33], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_33, simba_chiplet_34], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_34, simba_chiplet_35], bandwidth: 256}

  # ───────── Per-column off-chip DRAM links (Strix-style distributed memory access) ─────────
  # Each column's edge chiplet (row 0 = cores 0..5) gets its OWN link to the DRAM controller
  # (core 36), so DRAM bandwidth is distributed across 6 links rather than one shared bus. A single
  # shared bus is used in every steady-state slot and so has zero boundary idle, pinning the TETRA
  # inter-iteration overlap to 0; per-column links let that overlap grow when layers sit on different
  # columns. Deeper chiplets reach DRAM by routing up their column through the (wide) mesh.
  - {type: link, memories: [simba_offchip, simba_chiplet_0], bandwidth: 256}
  - {type: link, memories: [simba_offchip, simba_chiplet_1], bandwidth: 256}
  - {type: link, memories: [simba_offchip, simba_chiplet_2], bandwidth: 256}
  - {type: link, memories: [simba_offchip, simba_chiplet_3], bandwidth: 256}
  - {type: link, memories: [simba_offchip, simba_chiplet_4], bandwidth: 256}
  - {type: link, memories: [simba_offchip, simba_chiplet_5], bandwidth: 256}
