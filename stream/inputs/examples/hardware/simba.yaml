  simba_offchip: [36.dram]

connections:
  # ───────── 2-D mesh links (bandwidth 256 each) ─────────
  # Wide (256) on-chip mesh: weights reach the compute chiplets by routing through the mesh from the
  # per-column DRAM entry points below, so the mesh must be as wide as the DRAM links or it becomes
  # the bottleneck (a 32-wide mesh made this design ~4x slower than the old shared bus).
  - {type: link, memories: [simba_chiplet_0, simba_chiplet_1],  bandwidth: 256}
  - {type: link, memories: [simba_chiplet_0, simba_chiplet_6],  bandwidth: 256}
  - {type: link, memories: [simba_chiplet_1, simba_chiplet_2],  bandwidth: 256}
  - {type: link, memories: [simba_chiplet_1, simba_chiplet_7],  bandwidth: 256}
  - {type: link, memories: [simba_chiplet_2, simba_chiplet_3],  bandwidth: 256}
  - {type: link, memories: [simba_chiplet_2, simba_chiplet_8],  bandwidth: 256}
  - {type: link, memories: [simba_chiplet_3, simba_chiplet_4],  bandwidth: 256}
  - {type: link, memories: [simba_chiplet_3, simba_chiplet_9],  bandwidth: 256}
  - {type: link, memories: [simba_chiplet_4, simba_chiplet_5],  bandwidth: 256}
  - {type: link, memories: [simba_chiplet_4, simba_chiplet_10], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_5, simba_chiplet_11], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_6, simba_chiplet_7],  bandwidth: 256}
  - {type: link, memories: [simba_chiplet_6, simba_chiplet_12], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_7, simba_chiplet_8],  bandwidth: 256}
  - {type: link, memories: [simba_chiplet_7, simba_chiplet_13], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_8, simba_chiplet_9],  bandwidth: 256}
  - {type: link, memories: [simba_chiplet_8, simba_chiplet_14], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_9, simba_chiplet_10], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_9, simba_chiplet_15], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_10, simba_chiplet_11], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_10, simba_chiplet_16], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_11, simba_chiplet_17], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_12, simba_chiplet_13], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_12, simba_chiplet_18], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_13, simba_chiplet_14], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_13, simba_chiplet_19], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_14, simba_chiplet_15], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_14, simba_chiplet_20], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_15, simba_chiplet_16], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_15, simba_chiplet_21], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_16, simba_chiplet_17], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_16, simba_chiplet_22], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_17, simba_chiplet_23], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_18, simba_chiplet_19], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_18, simba_chiplet_24], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_19, simba_chiplet_20], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_19, simba_chiplet_25], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_20, simba_chiplet_21], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_20, simba_chiplet_26], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_21, simba_chiplet_22], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_21, simba_chiplet_27], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_22, simba_chiplet_23], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_22, simba_chiplet_28], bandwidth: 256}
  - {type: link, memories: [simba_chiplet_23, simba_chiplet_29], bandwidth: 256}
