connections:
  # ───────── 2-D mesh links (bandwidth 256 each) ─────────
  # Wide (256) on-chip mesh: weights reach the compute chiplets by routing through the mesh from the
  # per-column DRAM entry points below, so the mesh must be as wide as the DRAM links or it becomes
  # the bottleneck (a 32-wide mesh made this design ~4x slower than the old shared bus).
