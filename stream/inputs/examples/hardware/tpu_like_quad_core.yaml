# Four TPU-like compute cores + pooling, SIMD and off-chip DRAM controller
name: tpu_like_quad_core

cores:
  0: ./cores/tpu_like.yaml   # compute A
  1: ./cores/tpu_like.yaml   # compute B
  2: ./cores/tpu_like.yaml   # compute C
  3: ./cores/tpu_like.yaml   # compute D
  4: ./cores/pooling.yaml    # pooling engine
  5: ./cores/simd.yaml       # SIMD unit

core_coordinates:
  0: [0, 0]
  1: [1, 0]
  2: [1, 1]
  3: [0, 1]
  4: [2, 0]
  5: [2, 1]

unit_energy_cost: 0    # default energy for the connections

memories:
  tpu_like_0:
    offchip: false
    views: [0.sram_2MB]
    ports:
      r_port_1: {from: r_port_1, cores: [0]}
      w_port_1: {from: w_port_1, cores: [0]}
  tpu_like_1:
    offchip: false
    views: [1.sram_2MB]
    ports:
      r_port_1: {from: r_port_1, cores: [1]}
      w_port_1: {from: w_port_1, cores: [1]}
  tpu_like_2:
    offchip: false
    views: [2.sram_2MB]
    ports:
      r_port_1: {from: r_port_1, cores: [2]}
      w_port_1: {from: w_port_1, cores: [2]}
  tpu_like_3:
    offchip: false
    views: [3.sram_2MB]
    ports:
      r_port_1: {from: r_port_1, cores: [3]}
      w_port_1: {from: w_port_1, cores: [3]}
  pooling:
    offchip: false
    views: [4.sram_128KB]
    ports:
      r_port_1: {from: r_port_1, cores: [4]}
      w_port_1: {from: w_port_1, cores: [4]}
  simd:
    offchip: false
    views: [5.sram_128KB_2rw]
    ports:
      rw_port_1: {from: rw_port_1, cores: [5]}
      rw_port_2: {from: rw_port_2, cores: [5]}
  offchip:
    offchip: true
    views: []
    capacity_bits: 10000000000
    ports:
      rw_port_1: {bandwidth: 64, serves: {any: [read, write]}, read_energy: 15.625, write_energy: 15.625}

connections:
  # ───── 2-D mesh among the four compute cores ─────
  - type: link
    ends:
      tpu_like_0: [r_port_1, w_port_1]
      tpu_like_1: [r_port_1, w_port_1]
    bandwidth: 32
  - type: link
    ends:
      tpu_like_1: [r_port_1, w_port_1]
      tpu_like_2: [r_port_1, w_port_1]
    bandwidth: 32
  - type: link
    ends:
      tpu_like_2: [r_port_1, w_port_1]
      tpu_like_3: [r_port_1, w_port_1]
    bandwidth: 32
  - type: link
    ends:
      tpu_like_3: [r_port_1, w_port_1]
      tpu_like_0: [r_port_1, w_port_1]
    bandwidth: 32

  # ───── Pooling core connected to every compute core ─────
  - type: link
    ends:
      tpu_like_0: [r_port_1, w_port_1]
      pooling: [r_port_1, w_port_1]
    bandwidth: 32
  - type: link
    ends:
      tpu_like_1: [r_port_1, w_port_1]
      pooling: [r_port_1, w_port_1]
    bandwidth: 32
  - type: link
    ends:
      tpu_like_2: [r_port_1, w_port_1]
      pooling: [r_port_1, w_port_1]
    bandwidth: 32
  - type: link
    ends:
      tpu_like_3: [r_port_1, w_port_1]
      pooling: [r_port_1, w_port_1]
    bandwidth: 32

  # ───── SIMD core connected to every compute core ─────
  - type: link
    ends:
      tpu_like_0: [r_port_1, w_port_1]
      simd: [rw_port_1, rw_port_2]
    bandwidth: 32
  - type: link
    ends:
      tpu_like_1: [r_port_1, w_port_1]
      simd: [rw_port_1, rw_port_2]
    bandwidth: 32
  - type: link
    ends:
      tpu_like_2: [r_port_1, w_port_1]
      simd: [rw_port_1, rw_port_2]
    bandwidth: 32
  - type: link
    ends:
      tpu_like_3: [r_port_1, w_port_1]
      simd: [rw_port_1, rw_port_2]
    bandwidth: 32

  # ───── Shared bus to off-chip memory (all cores ↔ DRAM) ─────
  - type: bus
    ends:
      tpu_like_0: [r_port_1, w_port_1]
      tpu_like_1: [r_port_1, w_port_1]
      tpu_like_2: [r_port_1, w_port_1]
      tpu_like_3: [r_port_1, w_port_1]
      pooling: [r_port_1, w_port_1]
      simd: [rw_port_1, rw_port_2]
      offchip: [rw_port_1]
    bandwidth: 128        # wider than on-chip point-to-point links
