# Four TPU-like compute cores + pooling, SIMD and off-chip DRAM controller
name: tpu_like_quad_core

cores:
  0: ./cores/tpu_like.yaml   # compute A
  1: ./cores/tpu_like.yaml   # compute B
  2: ./cores/tpu_like.yaml   # compute C
  3: ./cores/tpu_like.yaml   # compute D
  4: ./cores/pooling.yaml    # pooling engine
  5: ./cores/simd.yaml       # SIMD unit
  6: ./cores/offchip.yaml    # DRAM controller

core_coordinates:
  0: [0, 0]
  1: [1, 0]
  2: [1, 1]
  3: [0, 1]
  4: [2, 0]
  5: [2, 1]
  6: [1, 2]

offchip_core_id: 6     # core that fronts external memory
unit_energy_cost: 0    # default energy for the connections

memories:
  tpu_like_0: [0.sram_2MB]
  tpu_like_1: [1.sram_2MB]
  tpu_like_2: [2.sram_2MB]
  tpu_like_3: [3.sram_2MB]
  pooling: [4.sram_128KB]
  simd: [5.sram_128KB_2rw]
  offchip: [6.dram]

connections:
  # ───── 2-D mesh among the four compute cores ─────
  - type: link
    memories: [tpu_like_0, tpu_like_1]
    bandwidth: 32
  - type: link
    memories: [tpu_like_1, tpu_like_2]
    bandwidth: 32
  - type: link
    memories: [tpu_like_2, tpu_like_3]
    bandwidth: 32
  - type: link
    memories: [tpu_like_3, tpu_like_0]
    bandwidth: 32

  # ───── Pooling core connected to every compute core ─────
  - type: link
    memories: [tpu_like_0, pooling]
    bandwidth: 32
  - type: link
    memories: [tpu_like_1, pooling]
    bandwidth: 32
  - type: link
    memories: [tpu_like_2, pooling]
    bandwidth: 32
  - type: link
    memories: [tpu_like_3, pooling]
    bandwidth: 32

  # ───── SIMD core connected to every compute core ─────
  - type: link
    memories: [tpu_like_0, simd]
    bandwidth: 32
  - type: link
    memories: [tpu_like_1, simd]
    bandwidth: 32
  - type: link
    memories: [tpu_like_2, simd]
    bandwidth: 32
  - type: link
    memories: [tpu_like_3, simd]
    bandwidth: 32

  # ───── Shared bus to off-chip memory (all cores ↔ DRAM) ─────
  - type: bus
    memories: [tpu_like_0, tpu_like_1, tpu_like_2, tpu_like_3, pooling, simd, offchip]
    bandwidth: 128        # wider than on-chip point-to-point links
