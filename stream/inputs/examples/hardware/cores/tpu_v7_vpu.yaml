# TPU7x (Ironwood) TensorCore vector unit (VPU) -- one per TensorCore.
#
# 8 sublanes x 128 lanes with four ALUs per lane (Jouppi et al. 2026), modelled as 8 x 128 x 4: the
# four vector-ALU slots of a bundle each work a whole (8, 128) register. It handles activations,
# elementwise arithmetic and the non-matrix parts of a block -- in a SwiGLU the SiLU and the gate
# multiply. Stream gives a core one operational array, so the VPU is its own core beside the
# TensorCore's two MXUs, sharing its VMEM.
#
# `vregs` are the 64 vector registers of 8 x 128 x 32 bits, loaded from and stored to the TensorCore's
# VMEM, the VPU's top memory. Bandwidths are bits per cycle at 2.2 GHz.
name: tpu_v7_vpu
type: zigzag.compute

memories:
  # 64 vector registers of (8, 128) x 32 bits, 256 KiB; four reads a cycle, one per ALU slot.
  vregs:
    size: 2097152
    r_cost: 0.05
    w_cost: 0.05
    area: 0
    latency: 1
    operands: [I1, I2, O]
    ports:
      - name: rw_port_1
        type: read_write
        bandwidth_min: 512
        bandwidth_max: 131072
        allocation:
          - I1, tl
          - I2, tl
          - O, tl
          - O, th
      - name: rw_port_2
        type: read_write
        bandwidth_min: 512
        bandwidth_max: 131072
        allocation:
          - I1, fh
          - I2, fh
          - O, fh
          - O, fl
    served_dimensions: [D1, D2, D3]

  # The TensorCore's 64 MiB VMEM, shared with its other MXU, its VPU and its VMEM core
  # (core_memory_sharing in tpu_v7_ironwood.yaml). Read and written at the vector load/store rate:
  # three 8 x 128 x 32-bit loads and two stores a cycle.
  vmem:
    size: 536870912
    r_cost: 200
    w_cost: 220
    area: 0
    latency: 1
    operands: [I1, I2, O]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 256
        bandwidth_max: 98304
        allocation:
          - I1, tl
          - I2, tl
          - O, tl
          - O, th
      - name: w_port_1
        type: write
        bandwidth_min: 256
        bandwidth_max: 65536
        allocation:
          - I1, fh
          - I2, fh
          - O, fh
          - O, fl
    served_dimensions: [D1, D2, D3]

operational_array:
  unit_energy: 0.06 # pJ per vector op
  unit_area: 0.05
  dimensions: [D1, D2, D3]
  sizes: [8, 128, 4]

# The VPU works in fp32. The cost model prices a lane as a full fp32 multiply-accumulate, which is
# an upper bound for the adds and activations that dominate a SwiGLU.
operand_precision:
  input: fp32
  accumulator: fp32

# Elementwise, activation, reduction and pooling ops -- everything that is not a matmul runs on the
# vector unit, not the MXU array. Pooling is a windowed reduction, so it belongs here alongside the
# reductions; without it, core selection finds no owner and smears the op across every compute core
# (an MXU cannot price a pool). Core selection matches on the node's op type, so listing a superset is
# harmless -- only the types actually present in a workload can match.
operator_types: [Add, Sub, Mul, Div, Exp, Pow, Silu, Sigmoid, Gelu, Tanh, Relu, Cast, Softmax, ReduceMax, ReduceSum, ReduceMean, MaxPool, AveragePool, GlobalAveragePool, GlobalMaxPool]
