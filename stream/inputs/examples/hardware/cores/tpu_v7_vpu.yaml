# TPU7x (Ironwood) TensorCore vector unit (VPU) -- one per TensorCore.
#
# A two-dimensional SIMD machine of (8, 128): 128 lanes x 8 sublanes, with several independent
# ALUs at each position. It handles activations, elementwise arithmetic and the non-matrix parts
# of a block -- in a SwiGLU that is the SiLU and the gate multiply.
#
# On real silicon the VPU sits inside the TensorCore alongside its eight MXUs and reads/writes the
# same 64 MiB VMEM. Stream gives a core one operational array, so the VPU is its own core and shares
# the TensorCore's VMEM (a separate memory core, tpu_v7_vmem.yaml) over the intra-TensorCore bus.
# That split is what lets the mapper put vector work on vector hardware instead of burning MXU rows.
#
# `operand_buffer` is array-local operand staging, not a second scratchpad. Bandwidths are
# bits/cycle at the 1.1 GHz core clock.
name: tpu_v7_vpu
type: zigzag.compute

memories:
  # Vector registers: 64 VREGs of (8, 128) x 32 bit ~= 256 KB per core.
  vregs:
    size: 2097152
    r_cost: 0.05
    w_cost: 0.05
    area: 0
    latency: 1
    operands: [I1, I2, O]
    ports:
      - name: rw_port_1
        type: read_write
        bandwidth_min: 512
        bandwidth_max: 52131
        allocation:
          - I1, tl
          - I2, tl
          - O, tl
          - O, th
      - name: rw_port_2
        type: read_write
        bandwidth_min: 512
        bandwidth_max: 52131
        allocation:
          - I1, fh
          - I2, fh
          - O, fh
          - O, fl
    served_dimensions: [D1, D2]

  # Array-local operand staging (2 MiB): the shared 64 MiB VMEM lives on tpu_v7_vmem.yaml, reached
  # over the intra-TensorCore bus. Kept small so it stays a staging FIFO, not a second scratchpad.
  # Port width is the VMEM feed bandwidth at 1.1 GHz.
  operand_buffer:
    size: 16777216
    r_cost: 120
    w_cost: 130
    area: 0
    latency: 1
    operands: [I1, I2, O]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 256
        bandwidth_max: 416974
        allocation:
          - I1, tl
          - I2, tl
          - O, tl
          - O, th
      - name: w_port_1
        type: write
        bandwidth_min: 256
        bandwidth_max: 416974
        allocation:
          - I1, fh
          - I2, fh
          - O, fh
          - O, fl
    served_dimensions: [D1, D2]

operational_array:
  unit_energy: 0.06 # pJ per vector op
  unit_area: 0.05
  dimensions: [D1, D2]
  sizes: [8, 128]

# The VPU works in fp32. The cost model prices a lane as a full fp32 multiply-accumulate, which is
# an upper bound for the adds and activations that dominate a SwiGLU.
operand_precision:
  input: fp32
  accumulator: fp32

# Elementwise, activation, reduction and pooling ops -- everything that is not a matmul runs on the
# vector unit, not the MXU array. Pooling is a windowed reduction, so it belongs here alongside the
# reductions; without it, core selection finds no owner and smears the op across all 36 compute cores
# (an MXU cannot price a pool). Core selection matches on the node's op type, so listing a superset is
# harmless -- only the types actually present in a workload can match.
operator_types: [Add, Sub, Mul, Div, Exp, Pow, Silu, Sigmoid, Gelu, Tanh, Relu, Softmax, ReduceMax, ReduceSum, ReduceMean, MaxPool, AveragePool, GlobalAveragePool, GlobalMaxPool]
