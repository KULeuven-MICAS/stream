# TPU7x HBM3E, fronted as the off-chip memory controller of a two-chip slice.
#
# Each chiplet owns four of a chip's eight HBM3E stacks: 96 GiB at 3.69 TB/s (7.37 TB/s per chip,
# Cloud TPU7x docs and Hot Chips 2025). Stream has one off-chip core, so the slice's four chiplets'
# stacks are one core of 384 GiB whose port carries all four chiplets' bandwidth, each chiplet's
# VMEM linked to it at its own 3.69 TB/s (tpu_v7_ironwood.yaml). 13,400 bits per cycle at 2.2 GHz
# per chiplet, 53,600 for the slice.
name: tpu_v7_hbm
type: zigzag.offchip

memories:
  hbm3e:
    size: 3298534883328
    r_cost: 4000
    w_cost: 4000
    area: 0
    latency: 1
    operands: [I1, I2, O]
    ports:
      - name: rw_port_1
        type: read_write
        bandwidth_min: 256
        bandwidth_max: 53600
        allocation:
          - I1, fh
          - I1, tl
          - I2, fh
          - I2, tl
          - O, fh
          - O, tl
          - O, fl
          - O, th
    served_dimensions: [D1, D2]

operational_array:
  unit_energy: 0
  unit_area: 0
  dimensions: [D1, D2]
  sizes: [0, 0]
