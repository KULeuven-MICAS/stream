# TPU7x HBM3E, fronted as the off-chip memory controller of a two-chip slice.
#
# Each chiplet owns four of a chip's eight HBM3E stacks: 96 GiB at 3.69 TB/s (7.37 TB/s per chip,
# Cloud TPU7x docs and Hot Chips 2025). Stream has one off-chip core, so the slice's four chiplets'
# stacks are one core of 384 GiB whose port carries all four chiplets' bandwidth, each chiplet's
# VMEM linked to it at its own 3.69 TB/s (tpu_v7_ironwood.yaml). 13,400 bits per cycle at 2.2 GHz
# per chiplet, 53,600 for the slice.
#
# Energies are a 3 nm estimate: about 4 pJ/bit for HBM3E, 0.24 pJ/bit to read the 64 MiB VMEM, 0.05 pJ/bit for a
# vector register and 0.015 pJ/bit for a PE register, 0.076 pJ per bf16 multiply-accumulate and 0.52 pJ per fp32
# vector op. A memory's r_cost and w_cost are its energy per bit times its port width, the bits one access moves.
name: tpu_v7_hbm
type: zigzag.offchip

memories:
  hbm3e:
    size: 3298534883328
    r_cost: 214400
    w_cost: 214400
    area: 0
    latency: 1
    operands: [I1, I2, O]
    ports:
      - name: rw_port_1
        type: read_write
        bandwidth_min: 256
        bandwidth_max: 53600
        allocation:
          - I1, fh
          - I1, tl
          - I2, fh
          - I2, tl
          - O, fh
          - O, tl
          - O, fl
          - O, th
    served_dimensions: [D1, D2]

operational_array:
  unit_energy: 0
  unit_area: 0
  dimensions: [D1, D2]
  sizes: [0, 0]
