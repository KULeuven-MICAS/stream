name: generic_array
type: compute

memories:
  rf_I:
    size: 16
    r_cost: 0.4
    w_cost: 0.4
    area: 0
    latency: 1
    operands: [I1]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 8
        bandwidth_max: 16
        allocation:
          - I1, tl
      - name: w_port_1
        type: write
        bandwidth_min: 8
        bandwidth_max: 16
        allocation:
          - I1, fh
    served_dimensions: []

  rf_W:
    size: 16
    r_cost: 0.4
    w_cost: 0.4
    area: 0
    latency: 1
    operands: [I2]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 4
        bandwidth_max: 16
        allocation:
          - I2, tl
      - name: w_port_1
        type: write
        bandwidth_min: 4
        bandwidth_max: 16
        allocation:
          - I2, fh
    served_dimensions: []

  # One fp32 partial sum per PE: the array is output stationary and accumulates in fp32, as TPU v2/v3 do
  rf_O:
    size: 32
    r_cost: 0.4
    w_cost: 0.4
    area: 0
    latency: 1
    operands: [O]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 32
        bandwidth_max: 32
        allocation:
          - O, tl
      - name: r_port_2
        type: read
        bandwidth_min: 32
        bandwidth_max: 32
        allocation:
          - O, th
      - name: w_port_1
        type: write
        bandwidth_min: 32
        bandwidth_max: 32
        allocation:
          - O, fh
      - name: w_port_2
        type: write
        bandwidth_min: 32
        bandwidth_max: 32
        allocation:
          - O, fl
    served_dimensions: []

  sram:
    size: 16777216
    r_cost: 8192
    w_cost: 8192
    area: 0
    latency: 1
    operands: [I1, I2, O]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 256
        bandwidth_max: 8192
        allocation:
          - I1, tl
          - I2, tl
          - O, tl
          - O, th
      - name: w_port_1
        type: write
        bandwidth_min: 256
        bandwidth_max: 8192
        allocation:
          - I1, fh
          - I2, fh
          - O, fh
          - O, fl
    served_dimensions: [D1, D2]

operational_array:
  unit_energy: 1.5
  unit_area: 1 # unit
  dimensions: [D1, D2]
  sizes: [256, 256]

# No fixed `dataflows`: let ZigZag generate the spatial (PE-array) mapping per layer.
# A fixed dataflow here yielded an EMPTY spatial mapping (near-zero MAC utilization) in
# the generic-mapping pipeline; letting ZigZag generate adapts the unrolling to each
# workload and actually fills the array.

# FuseMax builds on TPU v2/v3 (Nayak et al., MICRO 2024): bf16 multiplies, fp32 accumulation.
operand_precision:
  input: bf16
  accumulator: fp32
