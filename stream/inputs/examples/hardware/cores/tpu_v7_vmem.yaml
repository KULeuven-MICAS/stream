# TPU7x VMEM -- the software-managed scratchpad of one TensorCore, read by its two MXUs and its VPU.
#
# 64 MiB per TensorCore (Cloud TPU Ironwood docs; 128 MiB per chip). Tensors are staged into VMEM
# from the chiplet's HBM and streamed into the arrays from there, and a block's intermediates live
# here between the MXUs and the VPU. It is the top memory of the TensorCore's two MXUs and its VPU,
# shared with them (core_memory_sharing), so its 64 MiB is the TensorCore's one residency limit and its
# ports, at the vector load/store rate, are what all three read and write through. This core is where
# the chiplet's HBM, die-to-die and ICI links land. Bits per cycle at 2.2 GHz.
#
# Energies are a 3 nm estimate: about 4 pJ/bit for HBM3E, 0.24 pJ/bit to read the 64 MiB VMEM, 0.05 pJ/bit for a
# vector register and 0.015 pJ/bit for a PE register, 0.076 pJ per bf16 multiply-accumulate and 0.52 pJ per fp32
# vector op. A memory's r_cost and w_cost are its energy per bit times its port width, the bits one access moves.
name: tpu_v7_vmem
type: zigzag.memory

memories:
  vmem:
    size: 536870912
    r_cost: 23340
    w_cost: 25680
    area: 0
    latency: 1
    operands: [I1, I2, O]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 256
        bandwidth_max: 98304
        allocation:
          - I1, tl
          - I2, tl
          - O, tl
          - O, th
      - name: w_port_1
        type: write
        bandwidth_min: 256
        bandwidth_max: 65536
        allocation:
          - I1, fh
          - I2, fh
          - O, fh
          - O, fl
    served_dimensions: [D1, D2]

operational_array:
  unit_energy: 0
  unit_area: 0
  dimensions: [D1, D2]
  sizes: [0, 0]
