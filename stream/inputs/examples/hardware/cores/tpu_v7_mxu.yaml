# TPU7x (Ironwood) TensorCore matrix unit -- one of eight MXUs per TensorCore.
#
# A 256x256 systolic MXU, the array size Google moved to in v6e and kept for TPU7x (earlier
# generations were 128x128). Multiplies take bf16 and accumulate in fp32.
#
# A TensorCore carries eight of these MXUs (16 per chip, two TensorCores). At the 1.1 GHz Ironwood
# core clock, 32 MXUs across the two-chip slice deliver 32 * 65536 * 1.1e9 * 2 = 4.61 PFLOP/s bf16,
# i.e. 2.307 PFLOP/s per chip -- the published Ironwood bf16 peak. Each MXU is modelled as its own
# Stream core so the mapper can spread a Gemm across all eight, and all eight share the TensorCore's
# 64 MiB VMEM (a separate memory core they reach over a bus).
#
# The silicon is weight stationary: parameters are loaded into the array and held there while
# activations stream through. `served_dimensions: []` on the weight registers is one private weight
# register per PE; the accumulator is shared along D2 so partial sums reduce down an array axis
# rather than round-tripping through memory. Which axes land on D1/D2 is left to ZigZag's mapping
# search rather than pinned here, since the right choice is layer-dependent.
#
# `operand_buffer` is the array-local operand staging (weights held stationary plus the streaming
# activation/output tile), NOT a second scratchpad: the shared 128 MiB-per-chip VMEM lives on
# tpu_v7_vmem.yaml. Bandwidths are bits/cycle at the 1.1 GHz core clock.
name: tpu_v7_mxu
type: zigzag.compute

memories:
  # Weight registers: one per PE, held stationary for the duration of a tile.
  # 65536 PEs x 32 bit = 2 Mbit.
  wreg:
    size: 32
    r_cost: 0.02
    w_cost: 0.02
    area: 0
    latency: 1
    auto_cost_extraction: False
    operands: [I2]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 16
        bandwidth_max: 16
        allocation:
          - I2, tl
      - name: w_port_1
        type: write
        bandwidth_min: 16
        bandwidth_max: 16
        allocation:
          - I2, fh
    served_dimensions: []

  # fp32 accumulator per array column: partial sums walk down D2. Width is array-inherent (256
  # columns x 32 bit), so it does not scale with the core clock.
  accumulator:
    size: 8192
    r_cost: 0.01
    w_cost: 0.01
    area: 0
    latency: 1
    operands: [O]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 8192
        bandwidth_max: 8192
        allocation:
          - O, tl
      - name: r_port_2
        type: read
        bandwidth_min: 8192
        bandwidth_max: 8192
        allocation:
          - O, th
      - name: w_port_1
        type: write
        bandwidth_min: 8192
        bandwidth_max: 8192
        allocation:
          - O, fh
      - name: w_port_2
        type: write
        bandwidth_min: 8192
        bandwidth_max: 8192
        allocation:
          - O, fl
    served_dimensions: [D2]

  # Array-local operand staging (the register files plus a small operand FIFO), 2 MiB. It is
  # deliberately small: the TensorCore's 64 MiB working set lives on the shared VMEM core
  # (tpu_v7_vmem.yaml), reached over the intra-TensorCore bus, and keeping this buffer to a
  # steady-state tile stops it from becoming a second scratchpad that would hide the VMEM limit.
  # Port width is the VMEM feed bandwidth, re-derived at 1.1 GHz to preserve ~57 TB/s per TensorCore.
  operand_buffer:
    size: 16777216
    r_cost: 120
    w_cost: 130
    area: 0
    latency: 1
    operands: [I1, I2, O]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 256
        bandwidth_max: 416974
        allocation:
          - I1, tl
          - I2, tl
          - O, tl
          - O, th
      - name: w_port_1
        type: write
        bandwidth_min: 256
        bandwidth_max: 416974
        allocation:
          - I1, fh
          - I2, fh
          - O, fh
          - O, fl
    served_dimensions: [D1, D2]

operational_array:
  unit_energy: 0.02 # pJ per bf16 MAC
  unit_area: 1
  dimensions: [D1, D2]
  sizes: [256, 256]

# Multiplies take bf16, accumulation is fp32. `stream.hardware.cost` prices the array from this and
# `sizes` -- a static `unit_area` cannot survive a resize or a precision change.
operand_precision:
  input: bf16
  accumulator: fp32

# Matrix ops only. The vector unit is a separate core -- see tpu_v7_vpu.yaml.
operator_types: [MatMul, Gemm, Conv, Einsum]
