# TPU7x (Ironwood) matrix unit -- one of the two MXUs of a TensorCore.
#
# An Ironwood MXU is 256 wide and retires 262,144 bf16 FLOP per cycle (131,072 MACs): twice a
# 256x256 array, from two arrays per MXU slot or one retiring two rows per cycle (Google's
# Qwen-on-Ironwood post; JAX's tpu_info lists 2 MXUs per TensorCore, 256 columns each). It is
# modelled as 256 x 256 x 2: D1 and D2 the array, D3 the two rows sharing its weights. Four MXUs
# per chip at the 2.2 GHz clock give 4 * 131072 * 2 * 2.2e9 = 2.307 PFLOP/s bf16, the published
# peak. Multiplies take bf16 and accumulate in fp32.
#
# The silicon is weight stationary: a weight register per PE, read by both rows (served on D3);
# partial sums reduce along D2 into the result buffer, 128 accumulators of 8 x 256 fp32 per MXU
# (1 MiB, tpu_info). Weights and activations stream into the array straight from the TensorCore's
# VMEM, the MXU's top memory, which it shares with the TensorCore's other units. Bandwidths are bits
# per cycle at 2.2 GHz.
name: tpu_v7_mxu
type: zigzag.compute

memories:
  # One weight register per PE, 32 bits so a workload kept in fp32 maps too.
  wreg:
    size: 32
    r_cost: 0.02
    w_cost: 0.02
    area: 0
    latency: 1
    auto_cost_extraction: False
    operands: [I2]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 32
        bandwidth_max: 32
        allocation:
          - I2, tl
      - name: w_port_1
        type: write
        bandwidth_min: 32
        bandwidth_max: 32
        allocation:
          - I2, fh
    served_dimensions: [D3]

  # One per output lane (D1 x D3): 512 fp32 partial sums, the MXU's 1 MiB over its 512 lanes, each
  # taking one partial sum a cycle.
  result_buffer:
    size: 16384
    r_cost: 0.01
    w_cost: 0.01
    area: 0
    latency: 1
    operands: [O]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 32
        bandwidth_max: 32
        allocation:
          - O, tl
      - name: r_port_2
        type: read
        bandwidth_min: 32
        bandwidth_max: 32
        allocation:
          - O, th
      - name: w_port_1
        type: write
        bandwidth_min: 32
        bandwidth_max: 32
        allocation:
          - O, fh
      - name: w_port_2
        type: write
        bandwidth_min: 32
        bandwidth_max: 32
        allocation:
          - O, fl
    served_dimensions: [D2]

  # The TensorCore's 64 MiB VMEM, shared with its other MXU, its VPU and its VMEM core
  # (core_memory_sharing in tpu_v7_ironwood.yaml). Read and written at the vector load/store rate:
  # three 8 x 128 x 32-bit loads and two stores a cycle.
  vmem:
    size: 536870912
    r_cost: 200
    w_cost: 220
    area: 0
    latency: 1
    operands: [I1, I2, O]
    ports:
      - name: r_port_1
        type: read
        bandwidth_min: 256
        bandwidth_max: 98304
        allocation:
          - I1, tl
          - I2, tl
          - O, tl
          - O, th
      - name: w_port_1
        type: write
        bandwidth_min: 256
        bandwidth_max: 65536
        allocation:
          - I1, fh
          - I2, fh
          - O, fh
          - O, fl
    served_dimensions: [D1, D2, D3]

operational_array:
  unit_energy: 0.02 # pJ per bf16 MAC
  unit_area: 1
  dimensions: [D1, D2, D3]
  sizes: [256, 256, 2]

operand_precision:
  input: bf16
  accumulator: fp32

operator_types: [MatMul, Gemm, Conv, Einsum]
