# Two FuseMax cores sharing a top-level on-chip memory, plus an explicit DRAM controller
name: fusemax

cores:
  0: ./cores/fusemax_array.yaml  # main array core
  1: ./cores/fusemax_vec.yaml    # SIMD/vector core
  2: ./cores/fusemax_dram.yaml   # off-chip DRAM controller

offchip_core_id: 2          # core that fronts external memory
unit_energy_cost: 512       # default energy per transferred word

memories:
  sram: [0.sram, 1.sram]
  dram: [2.dram]

connections:
  # The one off-chip interface, between DRAM and the SRAM the array and vector cores share; the two cores move
  # data between them in place, in that SRAM.
  - type: link
    memories: [sram, dram]
    bandwidth: 512
