# Google TPU7x "Ironwood" (TPU v7) -- a two-chip slice.
#
# Per published specs, one Ironwood chip is a dual-chiplet part: 2 TensorCores, 4 SparseCores,
# 192 GiB HBM3e at 7380 GB/s, 2307 TFLOP/s bf16 and 4614 TFLOP/s fp8, with 1200 GB/s of
# inter-chip interconnect, at a 1.1 GHz core clock. Each TensorCore is eight 256x256 systolic MXUs
# plus a (8, 128) SIMD vector unit and a scalar unit, all reading from a software-managed 64 MiB
# VMEM scratchpad (128 MiB per chip). Multiplies take bf16; accumulation is fp32. The MXU dataflow
# is weight stationary.
#
# Modelling decisions:
#
#  * A TensorCore becomes eleven Stream cores: its eight MXUs, its VPU, and its VMEM. Stream gives a
#    core one operational array, and an MXU and a vector machine are very different arrays; giving
#    each MXU its own core lets the mapper spread a Gemm across all eight and send SiLU and the gate
#    multiply to the vector core instead of spending MXU rows on elementwise work.
#  * The VMEM is a separate memory core, not a level inside each compute core. It is the one physical
#    64 MiB scratchpad the whole TensorCore shares, so its capacity is the on-chip residency limit,
#    counted once. The MXUs and the VPU reach it over a per-TensorCore bus; an MXU->VPU hand-off is a
#    VMEM write then a VMEM read, the real cost.
#  * SparseCores are omitted. They accelerate embeddings and sparse lookups, which none of the dense
#    workloads modelled here touch.
#
# 32 MXUs across the slice at 1.1 GHz give 32 * 65536 * 1.1e9 * 2 = 4.61 PFLOP/s bf16 = 2.307/chip,
# the published peak. Bandwidths are bits/cycle at 1.1 GHz.
#
# Core map (per TensorCore: 8 MXU, 1 VPU, 1 VMEM):
#   chip 0: TC0 = MXU 0-7,  VPU 8,  VMEM 9    TC1 = MXU 10-17, VPU 18, VMEM 19
#   chip 1: TC2 = MXU 20-27, VPU 28, VMEM 29   TC3 = MXU 30-37, VPU 38, VMEM 39
#   HBM controller: 40
name: tpu_v7_ironwood

cores:
  0: ./cores/tpu_v7_mxu.yaml
