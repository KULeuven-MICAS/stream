# Google TPU7x "Ironwood" (TPU v7) -- a two-chip slice.
#
# Per chip (Cloud TPU7x docs, Hot Chips 2025, Jouppi et al. 2026, JAX's tpu_info): two compute
# chiplets, each one TensorCore -- two MXUs, a vector unit (VPU) and a 64 MiB VMEM -- with four HBM3E
# stacks of its own (96 GiB at 3.69 TB/s). The chiplets meet over a die-to-die link six times a 1D
# ICI link, about 600 GB/s each way. The ICI router and SerDes sit beside the second chiplet; a chip's
# six ICI links carry 100 GB/s each way. 2.307 PFLOP/s bf16 per chip at 2.2 GHz. SparseCores are
# omitted: they serve embeddings and sparse lookups, which none of the dense workloads here use.
#
# Modelling decisions:
#
#  * A TensorCore is four Stream cores: two MXUs, its VPU and its VMEM. Stream gives a core one
#    operational array, and a matrix unit and a vector machine are very different arrays.
#  * The VMEM is the top memory of the TensorCore's MXUs and VPU, shared between them and the
#    TensorCore's VMEM core (core_memory_sharing): its 64 MiB is the TensorCore's one residency limit,
#    its ports at the vector load/store rate the bandwidth all of them share, and a block's operands
#    reach the arrays from it in place. The VMEM core is where the chiplet's links land.
#  * Each chiplet's VMEM links to HBM at that chiplet's bandwidth; Stream has one off-chip core, and
#    a route never passes through it, so data between TensorCores takes the die-to-die link or ICI.
#  * The slice is two neighbouring chips joined by one ICI link between their second chiplets.
#
# Bandwidths are bits per cycle at 2.2 GHz (1 GB/s = 3.636 bits per cycle).
#
# Core map (per TensorCore: MXU, MXU, VPU, VMEM):
#   chip 0: TC0 = 0, 1, 2, 3     TC1 = 4, 5, 6, 7
#   chip 1: TC2 = 8, 9, 10, 11   TC3 = 12, 13, 14, 15
#   HBM: 16
name: tpu_v7_ironwood

cores:
  0: ./cores/tpu_v7_mxu.yaml
  1: ./cores/tpu_v7_mxu.yaml
  2: ./cores/tpu_v7_vpu.yaml
  3: ./cores/tpu_v7_vmem.yaml
  4: ./cores/tpu_v7_mxu.yaml
  5: ./cores/tpu_v7_mxu.yaml
  6: ./cores/tpu_v7_vpu.yaml
  7: ./cores/tpu_v7_vmem.yaml
  8: ./cores/tpu_v7_mxu.yaml
  9: ./cores/tpu_v7_mxu.yaml
  10: ./cores/tpu_v7_vpu.yaml
  11: ./cores/tpu_v7_vmem.yaml
  12: ./cores/tpu_v7_mxu.yaml
  13: ./cores/tpu_v7_mxu.yaml
  14: ./cores/tpu_v7_vpu.yaml
  15: ./cores/tpu_v7_vmem.yaml
  16: ./cores/tpu_v7_hbm.yaml

# [col, row]: one column per TensorCore, so all four VMEMs are usable as on-chip memory cores
# (col_id < nb_cols_to_use).
core_coordinates:
  0: [0, 0]
  1: [0, 1]
  2: [0, 2]
  3: [0, 3]
  4: [1, 0]
  5: [1, 1]
  6: [1, 2]
  7: [1, 3]
  8: [2, 0]
  9: [2, 1]
  10: [2, 2]
  11: [2, 3]
  12: [3, 0]
  13: [3, 1]
  14: [3, 2]
  15: [3, 3]
  16: [0, 4]

offchip_core_id: 16
unit_energy_cost: 0

# Each TensorCore's VMEM core, MXUs and VPU share the VMEM; the VMEM core is listed first, as its owner.
core_memory_sharing:
  - 3, 0, 1, 2
  - 7, 4, 5, 6
  - 11, 8, 9, 10
  - 15, 12, 13, 14

# HBM3E is read and written 32 bytes at a time (a 32-bit pseudo-channel, burst length 8), so a
# transfer whose contiguous runs are shorter, a tile of a tensor laid out another way, uses only part
# of each access.
bandwidth:
  16.hbm3e.rw_port_1:
    ceiling: 53600
    contiguous: 53600
    burst: 32

# ── Physical cost ──
# `area: 0` in the core files is not "free": area and access energy are computed from the declared
# capacities, widths, port counts and array dimensions by `stream.hardware.cost`.
technology_node: n3

core_connectivity:
  # ── Within a chip, the two chiplets' VMEMs meet over the die-to-die link, ~600 GB/s each way. ──
  - type: link
    cores: [3, 7]
    bandwidth: 2182
  - type: link
    cores: [11, 15]
    bandwidth: 2182

  # ── Between the chips: one ICI link between their second chiplets, 100 GB/s each way. ──
  - type: link
    cores: [7, 15]
    bandwidth: 364

  # ── HBM: each chiplet's VMEM reaches its own four stacks at 3.69 TB/s. ──
  - type: link
    cores: [3, 16]
    bandwidth: 13400
  - type: link
    cores: [7, 16]
    bandwidth: 13400
  - type: link
    cores: [11, 16]
    bandwidth: 13400
  - type: link
    cores: [15, 16]
    bandwidth: 13400
