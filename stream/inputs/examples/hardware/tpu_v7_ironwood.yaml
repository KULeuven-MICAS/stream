# [col, row]. VMEM cores sit at columns 0-3 (col_id < nb_cols_to_use) so all four are usable as
# on-chip memory cores; each TensorCore's compute cores share its column.
core_coordinates:
  0: [0, 0]
  1: [0, 1]
  2: [0, 2]
  3: [0, 3]
  4: [0, 4]
  5: [0, 5]
  6: [0, 6]
  7: [0, 7]
  8: [0, 8]
  9: [0, 9]
  10: [1, 0]
  11: [1, 1]
  12: [1, 2]
  13: [1, 3]
  14: [1, 4]
  15: [1, 5]
  16: [1, 6]
