# SwiGLU (256 tokens, d_model 4096, d_ff 14336) on a two-chip TPU7x slice, one layer at a time.
#
# The same tensor-parallel split as swiglu_tpu_v7_fused.yaml -- gate and up split d_ff over the eight
# MXUs, SiLU and the multiply over the four VPUs, down its contraction over the MXUs with a
# reduce-scatter of the partial sums -- but each layer is its own group, its inputs read from and its
# output written to HBM. Each layer is cut into at least eight blocks, so a block's loads overlap the
# block before's compute, along the axes that keep the arrays full: gate and up in blocks of 256 hidden
# columns and half of d_model per MXU, down in blocks of 256 of its contraction and half of d_model, the
# elementwise layers in blocks of 128 tokens and 896 hidden columns per VPU. The projections are bound
# by HBM; the down projection's reduce-scatter, with no other layer to hide behind, by the ICI link.
layers:
- name: Gemm_Left
  core_allocation: [[0, 1, 4, 5, 8, 9, 12, 13]]
  inter_core_tiling: [[{dim: D2, split: 8}]]
- name: Gemm_Right
  core_allocation: [[0, 1, 4, 5, 8, 9, 12, 13]]
  inter_core_tiling: [[{dim: D2, split: 8}]]
- name: Silu
  core_allocation: [[2, 6, 10, 14]]
  inter_core_tiling: [[{dim: D1, split: 4}]]
- name: Elt_Mul
  core_allocation: [[2, 6, 10, 14]]
  inter_core_tiling: [[{dim: D1, split: 4}]]
- name: Gemm_Down
  core_allocation: [[0, 1, 4, 5, 8, 9, 12, 13]]
  inter_core_tiling: [[{dim: D1, split: 8}]]

fused_groups:
- name: Gate_Proj
  layers: [Gemm_Left]
  intra_core_tiling:
  - {dim: Gemm_Left.D1, tile: 2048}
  - {dim: Gemm_Left.D2, tile: 256}
- name: Up_Proj
  layers: [Gemm_Right]
  intra_core_tiling:
  - {dim: Gemm_Right.D1, tile: 2048}
  - {dim: Gemm_Right.D2, tile: 256}
- name: Activation
  layers: [Silu]
  intra_core_tiling:
  - {dim: Silu.D0, tile: 128}
  - {dim: Silu.D1, tile: 896}
- name: Gate_Multiply
  layers: [Elt_Mul]
  intra_core_tiling:
  - {dim: Elt_Mul.D0, tile: 128}
  - {dim: Elt_Mul.D1, tile: 896}
- name: Down_Proj
  layers: [Gemm_Down]
  intra_core_tiling:
  - {dim: Gemm_Down.D1, tile: 256}
  - {dim: Gemm_Down.D2, tile: 2048}
