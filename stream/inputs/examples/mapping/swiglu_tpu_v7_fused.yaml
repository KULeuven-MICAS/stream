# SwiGLU on TPU7x, fused into one region streamed over the token axis.
#
# The three Gemms spread across all 32 MXU cores (eight per TensorCore), splitting their output
# columns (D2) 32 ways -- the natural split for a weight-stationary array, since each core then holds
# a different slice of the weights. SiLU and the gate multiply go to the four vector cores. All five
# layers sit in one fused group tiled along D0 (the 256 tokens) in blocks of 64, so a block of tokens
# flows gate -> up -> SiLU -> multiply -> down while it is still resident on the shared VMEM, and only
# the final result goes back to HBM.
#
# What that buys: the [256, d_ff] intermediates (gate, up, silu, hidden) never have to be
# materialised in full; tiling the token axis cuts the live set and turns HBM round-trips into
# on-chip hand-offs through the 64 MiB VMEM.
layers:
- name: Gemm_Left
  core_allocation: [[0, 1, 2, 3, 4, 5, 6, 7, 10, 11, 12, 13, 14, 15, 16, 17, 20, 21, 22, 23, 24, 25, 26, 27, 30, 31, 32, 33, 34, 35, 36, 37]]
  inter_core_tiling: [[{dim: D2, split: 32}]]
- name: Gemm_Right
  core_allocation: [[0, 1, 2, 3, 4, 5, 6, 7, 10, 11, 12, 13, 14, 15, 16, 17, 20, 21, 22, 23, 24, 25, 26, 27, 30, 31, 32, 33, 34, 35, 36, 37]]
  inter_core_tiling: [[{dim: D2, split: 32}]]
- name: Silu
  core_allocation: [[8, 18, 28, 38]]
  inter_core_tiling: [[{dim: D1, split: 4}]]
- name: Elt_Mul
  core_allocation: [[8, 18, 28, 38]]
  inter_core_tiling: [[{dim: D1, split: 4}]]
- name: Gemm_Down
  core_allocation: [[0, 1, 2, 3, 4, 5, 6, 7, 10, 11, 12, 13, 14, 15, 16, 17, 20, 21, 22, 23, 24, 25, 26, 27, 30, 31, 32, 33, 34, 35, 36, 37]]
  inter_core_tiling: [[{dim: D2, split: 32}]]

fused_groups:
- name: SwiGLU_Fused
  layers: [Gemm_Left, Gemm_Right, Silu, Elt_Mul, Gemm_Down]
  intra_core_tiling:
  - {dim: Gemm_Left.D0, tile: 64}
