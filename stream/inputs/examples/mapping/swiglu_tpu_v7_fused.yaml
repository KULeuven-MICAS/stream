# SwiGLU (256 tokens, d_model 4096, d_ff 14336) on a two-chip TPU7x slice, fused, tensor parallel.
#
# The Megatron MLP split across the slice's four TensorCores: the gate and up projections split d_ff
# (their output, D2) eight ways over the eight MXUs; SiLU and the gate multiply split it four ways over
# the VPUs, each reading its own TensorCore's VMEM; the down projection splits d_ff too, its
# contraction (D1), so each MXU holds a partial sum of the whole output. Those are reduce-scattered:
# each TensorCore completes a quarter of the output, half of it crossing the ICI link each way, and
# writes it to HBM. Nothing but the activations' quarter slices and the output ever leaves a chip.
#
# The group walks d_ff in blocks of 256 per MXU and the gate and up projections' d_model in halves, 14
# steps: every Gemm fills the 256-wide array, a step's [256 x 256] intermediates stay in VMEM, and the
# 336 MiB of weights stream from HBM once, each step's block loading while the one before computes.
# Weight streaming binds (all four HBM links busy); the reduce-scatter overlaps it.
layers:
- name: Gemm_Left
  core_allocation: [[0, 1, 4, 5, 8, 9, 12, 13]]
  inter_core_tiling: [[{dim: D2, split: 8}]]
- name: Gemm_Right
  core_allocation: [[0, 1, 4, 5, 8, 9, 12, 13]]
  inter_core_tiling: [[{dim: D2, split: 8}]]
- name: Silu
  core_allocation: [[2, 6, 10, 14]]
  inter_core_tiling: [[{dim: D1, split: 4}]]
- name: Elt_Mul
  core_allocation: [[2, 6, 10, 14]]
  inter_core_tiling: [[{dim: D1, split: 4}]]
- name: Gemm_Down
  core_allocation: [[0, 1, 4, 5, 8, 9, 12, 13]]
  inter_core_tiling: [[{dim: D1, split: 8}]]

fused_groups:
- name: SwiGLU_Fused
  layers: [Gemm_Left, Gemm_Right, Silu, Elt_Mul, Gemm_Down]
  intra_core_tiling:
  - {dim: Gemm_Left.D1, tile: 2048}
  - {dim: Gemm_Left.D2, tile: 256}
