name: tpu_like_quad_core

cores:
  0: tpu_like.yaml
  1: tpu_like.yaml
  2: tpu_like.yaml
  3: tpu_like.yaml
  4: pooling.yaml
  5: simd.yaml
  6: offchip.yaml

offchip_core_id: 6

memories:
  tpu_like_0: [0.sram_2MB]
  tpu_like_1: [1.sram_2MB]
  tpu_like_2: [2.sram_2MB]
  tpu_like_3: [3.sram_2MB]
  pooling: [4.sram_128KB]
  simd: [5.sram_128KB_2rw]
  offchip: [6.dram]

connections:
  # -------- 2-D mesh among compute cores (point-to-point links) ------------- #
  - type: link
    memories: [tpu_like_0, tpu_like_1]
    bandwidth: 128
    unit_energy_cost: 0
  - type: link
    memories: [tpu_like_1, tpu_like_2]
    bandwidth: 128
    unit_energy_cost: 0
  - type: link
    memories: [tpu_like_2, tpu_like_3]
    bandwidth: 128
    unit_energy_cost: 0
  - type: link
    memories: [tpu_like_3, tpu_like_0]
    bandwidth: 128
    unit_energy_cost: 0

  # -------------- Pooling core (id 4) linked to each compute core ----------- #
  - type: link
    memories: [tpu_like_0, pooling]
    bandwidth: 128
    unit_energy_cost: 0
  - type: link
    memories: [tpu_like_1, pooling]
    bandwidth: 128
    unit_energy_cost: 0
  - type: link
    memories: [tpu_like_2, pooling]
    bandwidth: 128
    unit_energy_cost: 0
  - type: link
    memories: [tpu_like_3, pooling]
    bandwidth: 128
    unit_energy_cost: 0

  # -------------- SIMD core (id 5) linked to each compute core -------------- #
  - type: link
    memories: [tpu_like_0, simd]
    bandwidth: 128
    unit_energy_cost: 0
  - type: link
    memories: [tpu_like_1, simd]
    bandwidth: 128
    unit_energy_cost: 0
  - type: link
    memories: [tpu_like_2, simd]
    bandwidth: 128
    unit_energy_cost: 0
  - type: link
    memories: [tpu_like_3, simd]
    bandwidth: 128
    unit_energy_cost: 0

  # -------- Shared off-chip memory bus: all cores share one medium ---------- #
  - type: bus
    memories: [tpu_like_0, tpu_like_1, tpu_like_2, tpu_like_3, pooling, simd, offchip]  # includes the DRAM controller itself
    bandwidth: 512               # fatter than on-chip links
    unit_energy_cost: 0
